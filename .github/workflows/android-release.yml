name: Android release build

# Manual trigger, so it can be started from a phone: GitHub → Actions →
# "Android release build" → Run workflow. Produces a signed .aab for Play and
# a signed .apk for sideloading, downloadable from the run's Artifacts.
on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Also build an APK for direct install'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Restore the upload keystore
        # The keystore is stored as base64 in a repository secret. It never
        # exists in the repo, and is written outside the workspace so it cannot
        # be picked up by anything that archives the checkout.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"

      - name: Build AAB (for Google Play)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
        working-directory: mobile/android

      - name: Build APK (for direct install)
        if: ${{ inputs.build_apk }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - name: Remove the keystore
        # Runners are ephemeral, but do not rely on that.
        if: always()
        run: rm -f "$RUNNER_TEMP/my-upload-key.jks"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mbbs-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mbbs-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
