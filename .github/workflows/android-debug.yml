name: Android debug APK

# Builds an installable APK with no secrets and no computer.
#
# The release workflow needs the upload keystore, which is still blocked on the
# Play upload-key reset. This one signs with the standard Android debug key that
# ships in the repo, so it runs today, from the GitHub mobile app:
#
#   Actions → "Android debug APK" → Run workflow → wait → download the artifact
#   → open the .apk on the phone → allow "install unknown apps" once.
#
# It installs as com.aistudio.mbbsqbank.aycxvd.debug, alongside the Play Store
# build rather than replacing it. Debug builds serve Google's TEST ads only.
#
# Note: Expo Go cannot run this app — it is bare React Native with native
# modules (Google Sign-In, AdMob) that Expo Go does not contain. This APK is
# the way to get it on a phone.

on:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npx eslint .

      - name: Progress fan-out check
        working-directory: mobile
        run: npm run check:fanout

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
