<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORBIT MBBS — screen preview</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0a14;
      }
      /* react-native-web renders a flex:1 child, which needs a flex parent
         with a real height or the whole tree collapses to zero. */
      #root {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
